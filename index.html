<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="todo-card">
        <h1>My Tasks</h1>

        <!-- input and a submit button -->
        <div>
            <form id="todo-form">
                <input type="text" id="todo-input" placeholder="Add New Task">
                <button type="submit">Add Task</button>
            </form>

            <!-- to do list -->
            <ul id="todo-list"></ul>

            <!-- footer stats -->
            <div class="todo-footer">
                <span id="task-count">0 tasks left</span>
                <button id="clear-btn">Clear Completed</button>
            </div>
        </div>
    </div>

    <!-- javascript link -->
    <script src="index.js"></script>
</body>
</html>
